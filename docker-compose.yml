services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodorder_app
    volumes:
      - ./:/var/www
    depends_on:
      - db
    env_file:
      - .env.docker

  nginx:
    image: nginx:stable
    container_name: foodorder_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: foodorder_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodorder
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: foodorder
      MYSQL_PASSWORD: foodorder
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodorder_reverb
    command: php artisan reverb:start --host=0.0.0.0
    restart: unless-stopped
    volumes:
      - ./:/var/www
    ports:
      - "8081:8081"
    depends_on:
      - db
    env_file:
      - .env.docker

volumes:
  db_data:
